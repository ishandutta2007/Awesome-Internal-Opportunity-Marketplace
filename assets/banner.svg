<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .node-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }
    
    /* Dynamic Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.06); }
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes floatNode1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatNode2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes ripple {
      0% { r: 12px; opacity: 0.8; }
      100% { r: 35px; opacity: 0; }
    }

    .pulse-bg-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulse-bg-2 {
      animation: pulseGlow 7s ease-in-out infinite reverse;
      transform-origin: 1000px 300px;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dashMove 12s linear infinite;
    }
    .float-item-1 {
      animation: floatNode1 5s ease-in-out infinite;
    }
    .float-item-2 {
      animation: floatNode2 6s ease-in-out infinite;
    }
    .ping-circle {
      animation: ripple 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .ping-circle-delay {
      animation: ripple 2.5s cubic-bezier(0, 0.2, 0.8, 1) 1.25s infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGradient)" />
  <rect width="1196" height="396" x="2" y="2" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Background Animated Ambient Glows -->
  <g class="pulse-bg-1">
    <circle cx="200" cy="120" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  </g>
  <g class="pulse-bg-2">
    <circle cx="1020" cy="280" r="160" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
  </g>

  <!-- Network / Skill Mesh Dynamic Flow Connections (Background layer) -->
  <g opacity="0.45">
    <path d="M 820,110 Q 920,80 1020,130 T 1120,230" fill="none" stroke="#6366f1" stroke-width="2" class="flow-line" />
    <path d="M 850,290 Q 960,330 1060,250 T 1140,160" fill="none" stroke="#06b6d4" stroke-width="2" class="flow-line" style="animation-direction: reverse;" />
    <path d="M 820,110 L 850,290" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />
    <path d="M 960,190 L 1020,130" fill="none" stroke="#475569" stroke-width="1.5" />
    <path d="M 960,190 L 1060,250" fill="none" stroke="#475569" stroke-width="1.5" />
    <path d="M 960,190 L 850,290" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- Dynamic Animated Graph Nodes & Cards (Positioned to the right side, non-overlapping with text) -->
  <g class="float-item-1">
    <!-- Center Hub: Talent Matching -->
    <g transform="translate(960, 190)">
      <circle cx="0" cy="0" class="ping-circle" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="0" cy="0" class="ping-circle-delay" fill="none" stroke="#818cf8" stroke-width="1.5" />
      <rect x="-65" y="-22" width="130" height="44" rx="22" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)" />
      <circle cx="-42" cy="0" r="7" fill="#38bdf8" />
      <text x="-25" y="5" class="node-text" fill="#38bdf8">AI Match Engine</text>
    </g>

    <!-- Node: Internal Gigs -->
    <g transform="translate(820, 110)">
      <rect x="-55" y="-18" width="110" height="36" rx="18" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="-35" cy="0" r="5" fill="#818cf8" />
      <text x="-20" y="4" class="node-text">🚀 Internal Gigs</text>
    </g>
  </g>

  <g class="float-item-2">
    <!-- Node: Skills Graph -->
    <g transform="translate(1040, 110)">
      <rect x="-60" y="-18" width="120" height="36" rx="18" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" />
      <circle cx="-40" cy="0" r="5" fill="#34d399" />
      <text x="-25" y="4" class="node-text">⚡ Skills Graph</text>
    </g>

    <!-- Node: Mentorship -->
    <g transform="translate(850, 290)">
      <rect x="-60" y="-18" width="120" height="36" rx="18" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="1.2" />
      <circle cx="-40" cy="0" r="5" fill="#f472b6" />
      <text x="-25" y="4" class="node-text">🤝 Mentorship</text>
    </g>

    <!-- Node: Career Paths -->
    <g transform="translate(1060, 275)">
      <rect x="-65" y="-18" width="130" height="36" rx="18" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.2" />
      <circle cx="-44" cy="0" r="5" fill="#fbbf24" />
      <text x="-28" y="4" class="node-text">📈 Career Paths</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, Badges (Left Aligned, Clear & Readable) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 75)">
      <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" class="pill-text">Enterprise Talent Mobility Ecosystem</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title-text">
      Awesome Internal
    </text>
    <text x="0" y="220" class="title-text" fill="url(#primaryGrad)">
      Opportunity Marketplace
    </text>

    <!-- Subtitle -->
    <text x="0" y="268" class="subtitle-text">
      Curated directory of SaaS platforms &amp; open-source projects for internal talent mobility,
    </text>
    <text x="0" y="296" class="subtitle-text">
      skills-based matching, gig allocation, and autonomous workforce agility.
    </text>

    <!-- Feature Highlights / Mini Tags -->
    <g transform="translate(0, 332)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="18" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">🎯 Skills-First Matching</text>

      <!-- Tag 2 -->
      <rect x="155" y="0" width="135" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="169" y="18" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">💼 Internal Gig Work</text>

      <!-- Tag 3 -->
      <rect x="300" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="314" y="18" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">🌐 Open-Source First</text>

      <!-- Tag 4 -->
      <rect x="450" y="0" width="135" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="464" y="18" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">🤖 AI Talent Graphs</text>
    </g>
  </g>
</svg>
